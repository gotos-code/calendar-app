<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
</head>
<body>
<div class="app-header">
  <div class="brand">📅 Calendar</div>
  <div class="right">
    <span id="whoami"></span>
    <a href="admin.html" id="adminLink" hidden>管理者ページ</a>
    <button class="btn secondary" onclick="logout()">ログアウト</button>
  </div>
</div>

<div class="app-shell">
  <div class="sidebar">
    <div class="mini-cal">
      <div class="mini-cal-header">
        <span id="miniLabel"></span>
        <div class="mini-cal-nav">
          <button id="miniPrev">‹</button>
          <button id="miniNext">›</button>
        </div>
      </div>
      <div class="mini-grid" id="miniDow"></div>
      <div class="mini-grid" id="miniGrid"></div>
    </div>
  </div>

  <div class="main-content">
    <div class="calendar-toolbar">
      <button class="icon-btn" id="prevBtn">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <div class="nav-btns">
        <div class="view-toggle">
          <button class="view-btn" data-mode="month">月</button>
          <button class="view-btn active" data-mode="week">週</button>
        </div>
        <button class="btn secondary" id="todayBtn">今日</button>
        <button class="icon-btn" id="nextBtn">›</button>
        <button class="btn" id="addBtn">+ 予定を追加</button>
      </div>
    </div>

    <div class="legend">
      <span><span class="dot personal"></span>個人スケジュール</span>
      <span><span class="dot appointment"></span>アポ</span>
    </div>

    <!-- Month view -->
    <div id="monthView" hidden>
      <div class="grid" id="dowRow">
        <div class="dow">日</div><div class="dow">月</div><div class="dow">火</div>
        <div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <!-- Week view: weekdays only, 8:00-21:00 time grid -->
    <div id="weekView">
      <div class="week-header" id="weekHeader"></div>
      <div class="week-body">
        <div class="week-hour-labels" id="weekHourLabels"></div>
        <div class="week-days" id="weekDays"></div>
      </div>
    </div>
  </div>
</div>

<!-- Day detail panel: list of events for a clicked day -->
<div class="overlay" id="dayOverlay" hidden>
  <div class="panel">
    <button class="panel-close" onclick="closeDayPanel()">×</button>
    <h2 id="dayTitle"></h2>
    <div class="panel-sub">この日の予定</div>
    <div id="dayEventList"></div>
    <button class="btn block" id="dayAddBtn">+ この日に予定を追加</button>
  </div>
</div>

<!-- Add / edit event form panel -->
<div class="overlay" id="formOverlay" hidden>
  <div class="panel">
    <button class="panel-close" onclick="closeFormPanel()">×</button>
    <h2 id="formTitle">予定を追加</h2>
    <div class="panel-sub" id="formOwner"></div>
    <form id="eventForm">
      <div class="field" id="typeField">
        <label>種類</label>
        <div class="type-toggle">
          <label class="opt-personal">
            <input type="radio" name="event_type" value="personal" checked>
            <span>個人</span>
          </label>
          <label class="opt-appointment">
            <input type="radio" name="event_type" value="appointment">
            <span>アポ</span>
          </label>
        </div>
      </div>
      <div class="field">
        <label for="f_title" id="titleLabel">タイトル</label>
        <input type="text" id="f_title">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="f_allday">
        <label for="f_allday">終日</label>
      </div>
      <div class="field">
        <label for="f_start_date">開始日</label>
        <input type="date" id="f_start_date" required>
      </div>
      <div class="field" id="f_start_time_wrap">
        <label for="f_start_time">開始時刻</label>
        <input type="time" id="f_start_time" step="900">
      </div>
      <div class="field" id="f_end_time_wrap">
        <label for="f_end_time">終了時刻(任意)</label>
        <input type="time" id="f_end_time" step="900">
      </div>
      <div class="field">
        <label for="f_memo">メモ(任意)</label>
        <textarea id="f_memo" rows="3"></textarea>
      </div>
      <div class="msg error" id="formMsg"></div>
      <div class="form-actions">
        <button type="button" class="btn secondary" id="deleteBtn" hidden>削除</button>
        <button type="submit" class="btn">保存</button>
      </div>
    </form>
  </div>
</div>

<script>
const HOUR_START = 8;
const HOUR_END = 21; // display window is 8:00-21:00
const HOUR_PX = 48;
const TOTAL_PX = (HOUR_END - HOUR_START) * HOUR_PX;
const WEEKDAY = ["日","月","火","水","木","金","土"];

let me = null;
let viewMode = "week"; // "month" | "week"
let viewDate = new Date();
let periodEvents = [];
let editingId = null;
let pendingDate = null;
let miniMonthDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
let miniEventDots = new Set();

function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

// Monday-based: the week view shows weekdays only (Mon-Fri).
function startOfWeek(d) {
  const r = new Date(d);
  r.setHours(0, 0, 0, 0);
  r.setDate(r.getDate() - ((r.getDay() + 6) % 7));
  return r;
}

function gridRange(monthFirst) {
  const start = new Date(monthFirst.getFullYear(), monthFirst.getMonth(), 1);
  start.setDate(start.getDate() - start.getDay());
  const end = new Date(start);
  end.setDate(end.getDate() + 42);
  return { start, end };
}

function weekRange(anyDate) {
  const start = startOfWeek(anyDate);
  const end = new Date(start);
  end.setDate(end.getDate() + 5); // Mon-Fri only
  return { start, end };
}

async function loadEvents() {
  const { start, end } = viewMode === "month" ? gridRange(viewDate) : weekRange(viewDate);
  const { data, error } = await sb
    .from("events")
    .select("*, owner:profiles(last_name, first_name, company_name, email)")
    .gte("start_at", start.toISOString())
    .lt("start_at", end.toISOString())
    .order("start_at", { ascending: true });

  if (error) {
    console.error(error);
    periodEvents = [];
    return;
  }
  periodEvents = data;
}

function eventsOnDay(dateStr) {
  // Bucket by the browser's local calendar date, not the raw UTC ISO string's
  // date portion (which shifts back a day for any local time before 9am JST).
  return periodEvents.filter(ev => ymd(new Date(ev.start_at)) === dateStr);
}

function ownerName(p) {
  if (!p) return "";
  const name = [p.last_name, p.first_name].filter(Boolean).join(" ");
  return name || p.email || "";
}

function fmtTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

async function refresh() {
  await loadEvents();
  if (viewMode === "month") renderMonth(); else renderWeek();

  if (miniMonthDate.getMonth() !== viewDate.getMonth() || miniMonthDate.getFullYear() !== viewDate.getFullYear()) {
    miniMonthDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
    await loadMiniDots();
  } else {
    renderMiniCal();
  }
}

// ---------- Mini month calendar (sidebar date picker) ----------

async function loadMiniDots() {
  const { start, end } = gridRange(miniMonthDate);
  const { data, error } = await sb
    .from("events")
    .select("start_at")
    .gte("start_at", start.toISOString())
    .lt("start_at", end.toISOString());

  miniEventDots = new Set(error ? [] : data.map(r => ymd(new Date(r.start_at))));
  renderMiniCal();
}

function renderMiniCal() {
  document.getElementById("miniLabel").textContent = `${miniMonthDate.getFullYear()}年${miniMonthDate.getMonth()+1}月`;
  document.getElementById("miniDow").innerHTML = WEEKDAY.map(w => `<div class="mini-dow">${w}</div>`).join("");

  const { start } = gridRange(miniMonthDate);
  const todayStr = ymd(new Date());
  const selectedStr = ymd(viewDate);
  const cells = [];

  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const dateStr = ymd(d);
    const classes = ["mini-day"];
    if (d.getMonth() !== miniMonthDate.getMonth()) classes.push("other-month");
    if (dateStr === todayStr) classes.push("today");
    if (dateStr === selectedStr) classes.push("selected");
    cells.push(`
      <div class="${classes.join(" ")}" data-date="${dateStr}">
        ${d.getDate()}${miniEventDots.has(dateStr) ? '<span class="mini-dot"></span>' : ""}
      </div>
    `);
  }
  document.getElementById("miniGrid").innerHTML = cells.join("");
}

document.getElementById("miniPrev").addEventListener("click", () => {
  miniMonthDate.setMonth(miniMonthDate.getMonth() - 1);
  loadMiniDots();
});
document.getElementById("miniNext").addEventListener("click", () => {
  miniMonthDate.setMonth(miniMonthDate.getMonth() + 1);
  loadMiniDots();
});
document.getElementById("miniGrid").addEventListener("click", (e) => {
  const cell = e.target.closest(".mini-day");
  if (!cell) return;
  viewDate = new Date(cell.dataset.date + "T00:00:00");
  refresh();
});

function setMode(mode) {
  viewMode = mode;
  document.querySelectorAll(".view-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  document.getElementById("monthView").hidden = mode !== "month";
  document.getElementById("weekView").hidden = mode !== "week";
  if (mode === "month") viewDate.setDate(1);
  refresh();
}

document.querySelectorAll(".view-btn").forEach(b => {
  b.addEventListener("click", () => setMode(b.dataset.mode));
});

// ---------- Month view ----------

function renderMonth() {
  document.getElementById("monthLabel").textContent =
    `${viewDate.getFullYear()}年 ${viewDate.getMonth()+1}月`;

  const { start } = gridRange(viewDate);
  const todayStr = ymd(new Date());
  const cells = [];

  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const dateStr = ymd(d);
    const inMonth = d.getMonth() === viewDate.getMonth();
    const dayEvents = eventsOnDay(dateStr);
    const shown = dayEvents.slice(0, 3);
    const extra = dayEvents.length - shown.length;

    cells.push(`
      <div class="day-cell ${inMonth ? "" : "other-month"} ${dateStr === todayStr ? "today" : ""}" data-date="${dateStr}">
        <div class="day-num">${d.getDate()}</div>
        ${shown.map(ev => `
          <div class="chip ${ev.event_type}" data-event-id="${ev.id}"
               title="${ownerName(ev.owner)}${ev.owner?.company_name ? " (" + ev.owner.company_name + ")" : ""} - ${ev.title}">
            ${ev.all_day ? "" : fmtTime(ev.start_at) + " "}${ev.title}
          </div>
        `).join("")}
        ${extra > 0 ? `<div class="chip-more">+${extra}件</div>` : ""}
      </div>
    `);
  }
  document.getElementById("grid").innerHTML = cells.join("");
}

document.getElementById("grid").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  const cell = e.target.closest(".day-cell");
  if (!cell) return;
  if (chip) {
    const ev = periodEvents.find(x => x.id === chip.dataset.eventId);
    if (ev) openFormPanel(ev, null);
    return;
  }
  openDayPanel(cell.dataset.date);
});

// ---------- Week view (8:00-21:00 time grid) ----------

function layoutDayEvents(events) {
  const sorted = [...events].sort((a, b) => new Date(a.start_at) - new Date(b.start_at));
  const colEnds = [];
  sorted.forEach(ev => {
    const startMs = new Date(ev.start_at).getTime();
    const endMs = ev.end_at ? new Date(ev.end_at).getTime() : startMs + 30 * 60000;
    let col = colEnds.findIndex(endTime => endTime <= startMs);
    if (col === -1) { col = colEnds.length; colEnds.push(endMs); }
    else { colEnds[col] = endMs; }
    ev._col = col;
  });
  const totalCols = colEnds.length || 1;
  sorted.forEach(ev => ev._totalCols = totalCols);
  return sorted;
}

function renderWeekEventBlock(ev) {
  const start = new Date(ev.start_at);
  const startHourFloat = start.getHours() + start.getMinutes() / 60;
  const end = ev.end_at ? new Date(ev.end_at) : new Date(start.getTime() + 30 * 60000);
  const endHourFloat = Math.max(startHourFloat + 0.25, end.getHours() + end.getMinutes() / 60);

  const top = Math.max(0, (startHourFloat - HOUR_START) * HOUR_PX);
  const height = Math.max(18, (Math.min(endHourFloat, HOUR_END) - Math.max(startHourFloat, HOUR_START)) * HOUR_PX);
  const width = 100 / ev._totalCols;
  const left = ev._col * width;

  return `
    <div class="week-event-block ${ev.event_type}" data-event-id="${ev.id}"
         style="top:${top}px; height:${height}px; width:calc(${width}% - 3px); left:calc(${left}% + 2px);"
         title="${ownerName(ev.owner)}${ev.owner?.company_name ? " (" + ev.owner.company_name + ")" : ""} - ${ev.title}">
      <div class="wb-time">${fmtTime(ev.start_at)}${ev.end_at ? "-" + fmtTime(ev.end_at) : ""}</div>${ev.title}
    </div>
  `;
}

function renderWeek() {
  const start = startOfWeek(viewDate);
  const days = [...Array(5)].map((_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return d; });
  const todayStr = ymd(new Date());
  const endDay = days[4];

  document.getElementById("monthLabel").textContent = start.getMonth() === endDay.getMonth()
    ? `${start.getFullYear()}年${start.getMonth()+1}月${start.getDate()}日 - ${endDay.getDate()}日`
    : `${start.getFullYear()}年${start.getMonth()+1}月${start.getDate()}日 - ${endDay.getMonth()+1}月${endDay.getDate()}日`;

  document.getElementById("weekHeader").innerHTML = `<div></div>` + days.map(d => `
    <div class="week-header-cell ${ymd(d) === todayStr ? "today" : ""}" data-date="${ymd(d)}">
      ${WEEKDAY[d.getDay()]}<br>${d.getDate()}
    </div>
  `).join("");

  const hourLabels = [];
  for (let h = HOUR_START; h < HOUR_END; h++) {
    hourLabels.push(`<div class="week-hour-label" style="top:${(h - HOUR_START) * HOUR_PX}px">${h}:00</div>`);
  }
  const hourLabelsEl = document.getElementById("weekHourLabels");
  hourLabelsEl.innerHTML = hourLabels.join("");
  hourLabelsEl.style.height = TOTAL_PX + "px";

  document.getElementById("weekDays").innerHTML = days.map(d => {
    const dayStr = ymd(d);
    const dayEvents = eventsOnDay(dayStr);
    const allDayEvents = dayEvents.filter(ev => ev.all_day);
    const laidOut = layoutDayEvents(dayEvents.filter(ev => !ev.all_day));
    return `<div class="week-day-col ${dayStr === todayStr ? "today" : ""}" style="height:${TOTAL_PX}px" data-date="${dayStr}">
      ${renderTickLines()}
      ${allDayEvents.map((ev, i) => renderAllDayBand(ev, i, allDayEvents.length)).join("")}
      ${laidOut.map(ev => renderWeekEventBlock(ev)).join("")}
    </div>`;
  }).join("");
}

// All-day events have no specific time, so instead of a separate row above
// the grid, they render as a full-height (8:00-21:00) band inside the day's
// own column, behind the timed event blocks.
function renderAllDayBand(ev, index, total) {
  const width = 100 / total;
  const left = index * width;
  return `
    <div class="week-allday-band ${ev.event_type}" data-event-id="${ev.id}"
         style="left:calc(${left}% + 2px); width:calc(${width}% - 4px);"
         title="${ownerName(ev.owner)}${ev.owner?.company_name ? " (" + ev.owner.company_name + ")" : ""} - ${ev.title}">
      <span class="wab-label">${ev.title}</span>
    </div>
  `;
}

function renderTickLines() {
  let html = "";
  for (let h = HOUR_START; h < HOUR_END; h++) {
    const top = (h - HOUR_START) * HOUR_PX;
    html += `<div class="hour-line" style="top:${top}px"></div>`;
    html += `<div class="half-hour-line" style="top:${top + HOUR_PX / 2}px"></div>`;
  }
  return html;
}

function openDayPanelFromCell(dateStr) {
  openDayPanel(dateStr);
}

document.getElementById("weekHeader").addEventListener("click", (e) => {
  const cell = e.target.closest(".week-header-cell");
  if (cell) openDayPanelFromCell(cell.dataset.date);
});

document.getElementById("weekDays").addEventListener("click", (e) => {
  const block = e.target.closest(".week-event-block, .week-allday-band");
  if (!block) return;
  const ev = periodEvents.find(x => x.id === block.dataset.eventId);
  if (ev) openFormPanel(ev, null);
});

// Drag-to-select a start/end time range (like Google Calendar), snapped to 30 minutes.
// (The time input fields themselves still allow 15-minute steps for fine-tuning.)
// A plain click (no real drag) still works and opens the form with a default 30-min slot.
let weekDrag = null;

function clampPx(v) { return Math.max(0, Math.min(TOTAL_PX, v)); }
function snapDrag(px) { const unit = HOUR_PX / 2; return Math.round(px / unit) * unit; }
function pxToTime(px) {
  const totalMinutes = Math.round((px / HOUR_PX) * 60);
  const hour = Math.min(HOUR_START + Math.floor(totalMinutes / 60), HOUR_END);
  const minute = totalMinutes % 60;
  return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
}

document.getElementById("weekDays").addEventListener("mousedown", (e) => {
  if (e.target.closest(".week-event-block, .week-allday-band")) return;
  const col = e.target.closest(".week-day-col");
  if (!col) return;
  e.preventDefault();
  const rect = col.getBoundingClientRect();
  const startY = clampPx(e.clientY - rect.top);
  const preview = document.createElement("div");
  preview.className = "week-drag-preview";
  preview.style.top = startY + "px";
  preview.style.height = "2px";
  col.appendChild(preview);
  weekDrag = { dateStr: col.dataset.date, col, startY, preview, moved: false };
});

document.addEventListener("mousemove", (e) => {
  if (!weekDrag) return;
  const rect = weekDrag.col.getBoundingClientRect();
  const curY = clampPx(e.clientY - rect.top);
  if (Math.abs(curY - weekDrag.startY) > 3) weekDrag.moved = true;
  const top = Math.min(weekDrag.startY, curY);
  const height = Math.max(4, Math.abs(curY - weekDrag.startY));
  weekDrag.preview.style.top = top + "px";
  weekDrag.preview.style.height = height + "px";
});

document.addEventListener("mouseup", (e) => {
  if (!weekDrag) return;
  const { dateStr, col, startY, preview, moved } = weekDrag;
  weekDrag = null;
  preview.remove();

  const rect = col.getBoundingClientRect();
  const endY = clampPx(e.clientY - rect.top);
  let y1 = snapDrag(Math.min(startY, endY));
  let y2 = snapDrag(Math.max(startY, endY));
  if (!moved || y2 - y1 < 1) y2 = y1 + HOUR_PX / 2; // plain click -> default 30-min slot

  openFormPanel(null, dateStr, pxToTime(y1), pxToTime(y2));
});

// ---------- Day detail panel ----------

function openDayPanel(dateStr) {
  pendingDate = dateStr;
  const d = new Date(dateStr + "T00:00:00");
  document.getElementById("dayTitle").textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${WEEKDAY[d.getDay()]})`;

  const dayEvents = eventsOnDay(dateStr);
  document.getElementById("dayEventList").innerHTML = dayEvents.length ? dayEvents.map(ev => `
    <div class="event-row" data-event-id="${ev.id}">
      <span class="badge ${ev.event_type}">${ev.event_type === "personal" ? "個人" : "アポ"}</span>
      <div class="ev-main">
        <div class="ev-title">${ev.title}</div>
        <div class="ev-meta">
          ${ev.all_day ? "終日" : fmtTime(ev.start_at) + (ev.end_at ? " - " + fmtTime(ev.end_at) : "")}
          ・${ownerName(ev.owner)}${ev.owner?.company_name ? "(" + ev.owner.company_name + ")" : ""}
        </div>
      </div>
    </div>
  `).join("") : '<div class="msg info">予定はありません</div>';

  document.getElementById("dayOverlay").hidden = false;
}

function closeDayPanel() {
  document.getElementById("dayOverlay").hidden = true;
}

document.getElementById("dayEventList").addEventListener("click", (e) => {
  const row = e.target.closest(".event-row");
  if (!row) return;
  const ev = periodEvents.find(x => x.id === row.dataset.eventId);
  if (ev) {
    closeDayPanel();
    openFormPanel(ev, null);
  }
});

document.getElementById("dayAddBtn").addEventListener("click", () => {
  closeDayPanel();
  openFormPanel(null, pendingDate);
});

document.getElementById("addBtn").addEventListener("click", () => {
  openFormPanel(null, ymd(new Date()));
});

// ---------- Add / edit event form ----------

function openFormPanel(ev, dateStr, presetStartTime, presetEndTime) {
  editingId = ev ? ev.id : null;
  document.getElementById("formTitle").textContent = ev ? "予定を編集" : "予定を追加";
  document.getElementById("formMsg").textContent = "";

  const canEdit = !ev || ev.owner_id === me.id || me.role === "admin";
  document.getElementById("formOwner").textContent = ev
    ? `作成者: ${ownerName(ev.owner)}`
    : `作成者: ${ownerName(me)}`;

  // New events are fixed to a type based on the creator's role; only admins
  // get to pick freely (and can retype an existing event of any owner).
  const effectiveType = ev ? ev.event_type : (me.role === "operator" ? "appointment" : "personal");
  document.querySelector(`input[name="event_type"][value="${effectiveType}"]`).checked = true;

  document.getElementById("titleLabel").textContent = effectiveType === "appointment" ? "会社名" : "タイトル";
  document.getElementById("f_title").required = me.role !== "client";

  document.getElementById("f_title").value = ev ? ev.title : "";
  document.getElementById("f_allday").checked = ev ? ev.all_day : false;

  const defaultStart = presetStartTime || "09:00";
  const startD = ev ? new Date(ev.start_at) : new Date(dateStr + "T" + defaultStart + ":00");
  document.getElementById("f_start_date").value = ymd(startD);
  document.getElementById("f_start_time").value =
    ev && !ev.all_day ? fmtTime(ev.start_at) : (ev ? "" : defaultStart);
  document.getElementById("f_end_time").value =
    ev && ev.end_at ? fmtTime(ev.end_at) : (ev ? "" : (presetEndTime || ""));
  document.getElementById("f_memo").value = ev ? (ev.memo || "") : "";

  toggleAllDayFields();

  const deleteBtn = document.getElementById("deleteBtn");
  deleteBtn.hidden = !(ev && canEdit);

  document.querySelectorAll("#eventForm input, #eventForm textarea, #eventForm button")
    .forEach(el => el.disabled = !canEdit && !!ev);

  document.getElementById("formOverlay").hidden = false;
}

function closeFormPanel() {
  document.getElementById("formOverlay").hidden = true;
}

function toggleAllDayFields() {
  const allDay = document.getElementById("f_allday").checked;
  document.getElementById("f_start_time_wrap").style.display = allDay ? "none" : "block";
  document.getElementById("f_end_time_wrap").style.display = allDay ? "none" : "block";
  // All-day events don't need a personal/appointment distinction either.
  document.getElementById("typeField").hidden = allDay || me.role !== "admin";
}

document.getElementById("f_allday").addEventListener("change", toggleAllDayFields);

document.getElementById("eventForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("formMsg");
  msg.textContent = "";

  const allDay = document.getElementById("f_allday").checked;
  const startDate = document.getElementById("f_start_date").value;
  const startTime = allDay ? "00:00" : (document.getElementById("f_start_time").value || "00:00");
  const endTime = document.getElementById("f_end_time").value;

  const start_at = new Date(`${startDate}T${startTime}:00`).toISOString();
  const end_at = (!allDay && endTime) ? new Date(`${startDate}T${endTime}:00`).toISOString() : null;

  let title = document.getElementById("f_title").value.trim();
  if (!title && me.role === "client") title = "予定あり";

  const payload = {
    title,
    event_type: document.querySelector('input[name="event_type"]:checked').value,
    all_day: allDay,
    start_at,
    end_at,
    memo: document.getElementById("f_memo").value.trim() || null,
  };

  let error;
  if (editingId) {
    ({ error } = await sb.from("events").update(payload).eq("id", editingId));
  } else {
    payload.owner_id = me.id;
    ({ error } = await sb.from("events").insert(payload));
  }

  if (error) {
    msg.textContent = "保存に失敗しました: " + error.message;
    return;
  }

  closeFormPanel();
  await refresh();
});

document.getElementById("deleteBtn").addEventListener("click", async () => {
  if (!editingId) return;
  if (!confirm("この予定を削除しますか?")) return;
  const { error } = await sb.from("events").delete().eq("id", editingId);
  if (error) {
    document.getElementById("formMsg").textContent = "削除に失敗しました: " + error.message;
    return;
  }
  closeFormPanel();
  await refresh();
});

// ---------- Navigation ----------

document.getElementById("prevBtn").addEventListener("click", () => {
  if (viewMode === "month") viewDate.setMonth(viewDate.getMonth() - 1);
  else viewDate.setDate(viewDate.getDate() - 7);
  refresh();
});

document.getElementById("nextBtn").addEventListener("click", () => {
  if (viewMode === "month") viewDate.setMonth(viewDate.getMonth() + 1);
  else viewDate.setDate(viewDate.getDate() + 7);
  refresh();
});

document.getElementById("todayBtn").addEventListener("click", () => {
  viewDate = new Date();
  if (viewMode === "month") viewDate.setDate(1);
  refresh();
});

(async () => {
  me = await requireApprovedSession();
  if (!me) return;
  document.getElementById("whoami").textContent = ownerName(me);
  if (me.role === "admin") document.getElementById("adminLink").hidden = false;
  await loadMiniDots();
  setMode("week");
})();
</script>
</body>
</html>
