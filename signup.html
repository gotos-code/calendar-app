<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規登録 - Calendar</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>Calendar 新規登録</h1>
    <form id="form">
      <div class="field">
        <label for="name">お名前</label>
        <input type="text" id="name" required autocomplete="name">
      </div>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">パスワード(6文字以上)</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn block" id="submitBtn">登録する</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="switch-link">すでにアカウントをお持ちの方は <a href="login.html">ログイン</a></div>
  </div>
</div>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");
  msg.className = "msg";
  msg.textContent = "";
  btn.disabled = true;

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: { data: { display_name: name } }
  });

  if (error) {
    msg.className = "msg error";
    msg.textContent = error.message;
    btn.disabled = false;
    return;
  }

  if (data.session) {
    // Email confirmation is disabled on this project; session starts immediately.
    location.href = "index.html";
    return;
  }

  msg.className = "msg info";
  msg.innerHTML = "登録が完了しました。確認メールのリンクをクリックした後、管理者の承認をお待ちください。";
  document.getElementById("form").querySelectorAll("input, button").forEach(el => el.disabled = true);
});
</script>
</body>
</html>
